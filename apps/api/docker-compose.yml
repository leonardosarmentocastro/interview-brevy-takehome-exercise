services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: brevy
      POSTGRES_PASSWORD: brevy
      POSTGRES_DB: brevy
    ports:
      - "5433:5432"
    volumes:
      - brevy_pg:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d

volumes:
  brevy_pg:
